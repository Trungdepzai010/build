name: Build Trutyinfo

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -miphoneos-version-min=13.0 -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics Trutyinfo.m -o Trutyinfo.dylib
      - name: Sign
        run: codesign -f -s - Trutyinfo.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: Trutyinfo
          path: Trutyinfo.dylib
